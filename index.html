<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Paddō</title>
    <meta name="description" content="A quiet markdown editor for prose, with an agent that proposes edits you review inline." />
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- No manifest link here: vite-plugin-pwa injects it, with the mount prefix on it. -->
    <script>
      // A subpath proxy answers /paddo and /paddo/ alike, but at /paddo (no trailing
      // slash) the browser resolves relative URLs against the origin root and the app
      // arrives unstyled. Normalise that before anything else runs.
      (function () {
        var base = '%BASE_URL%'
        if (base === '/') return
        if (window.location.pathname + '/' === base) {
          window.location.replace(base + window.location.search + window.location.hash)
        }
      })()
    </script>
    <script>
      // Resolve the theme before the first paint, so a dark reader never sees a
      // flash of paper. Settings is the source of truth; this is just the cache.
      (function () {
        var stored = null
        try {
          stored = localStorage.getItem('paddo-theme')
        } catch (error) {
          stored = null
        }
        var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themeSetting = theme
      })()
    </script>
    <link rel="preload" href="/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/young-serif.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
